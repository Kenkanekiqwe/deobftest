[package]
name = "deobf"
version = "0.2.0"
edition = "2021"
description = "Hardened custom authenticated file protection container"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rpassword = "7"
zstd = "0.13"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug"] }
