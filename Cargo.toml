[package]
name = "deobf"
version = "0.7.3"
edition = "2021"
description = "Windows software protection and authenticated runtime packaging toolkit"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:iced", "dep:rfd"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
zeroize = "1"
zip = "2"
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "fira-sans", "image", "lazy"], optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

# Internal PE overlay loader and compile-time embed source. Not a user download.
[[bin]]
name = "deobf-stub"
path = "src/bin/deobf-stub.rs"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = false
strip = "symbols"
panic = "abort"
