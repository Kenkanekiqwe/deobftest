name: Build DEOBF Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/deobf.exe" "dist/deobf-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: deobf-windows-x64
          path: dist/deobf-windows-x64.exe
          if-no-files-found: error

  release:
    name: Publish Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deobf-windows-x64
          path: dist
      - name: Checksums
        shell: pwsh
        run: |
          (Get-FileHash "dist/deobf-windows-x64.exe" -Algorithm SHA256).Hash | Out-File "dist/SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
