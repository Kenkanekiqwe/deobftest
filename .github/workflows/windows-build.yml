name: Windows Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true

      - name: Build Windows release
        run: cargo build --release --bin deobf --bin deobf-gui

      - name: Package Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/deobf.exe dist/deobf.exe
          Copy-Item target/release/deobf-gui.exe dist/deobf-gui.exe
          Compress-Archive -Path dist/* -DestinationPath deobf-windows-x64.zip -Force

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: deobf-windows-x64
          path: deobf-windows-x64.zip
          if-no-files-found: error
