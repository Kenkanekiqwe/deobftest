name: Windows GUI (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: true
          cache-all-crates: true
      - name: Build GUI
        run: cargo build --release --target x86_64-pc-windows-msvc --bin deobf-gui
      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: deobf-windows-gui
          path: target/x86_64-pc-windows-msvc/release/deobf-gui.exe
